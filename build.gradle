plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT' apply false
    id 'net.neoforged.moddev' version '2.0.+' apply false
    id 'org.spongepowered.gradle.vanilla' version '0.2.1-SNAPSHOT' apply false
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT' apply false

    id "io.github.pacifistmc.forgix" version "1.2.9"
}

forgix {
    group = "${project.group}"
    mergedJarName = "${mod_id}-merged-${minecraft_version}-${project.version}.jar"
    outputDir = "build/libs"

    custom {
        projectName = "common"
        jarLocation = "build/libs/${mod_id}-common-${minecraft_version}-${project.version}.jar"
    }

    fabric {
        projectName = "fabric"
        jarLocation = "build/libs/letsdo-${mod_id}-fabric-${project.version}.jar"
    }

    neoforge {
        projectName = "neoforge"
        jarLocation = "build/libs/letsdo-${mod_id}-neoforge-${project.version}.jar"
        mixin "${mod_id}-neoforge.mixins.json"
    }
}

subprojects {
    apply plugin: 'java'

    java.toolchain.languageVersion = JavaLanguageVersion.of(21)

    jar {
        manifest {
            attributes([
                    'Specification-Title'     : mod_name,
                    'Specification-Vendor'    : mod_author,
                    'Specification-Version'   : project.jar.archiveVersion,
                    'Implementation-Title'    : project.name,
                    'Implementation-Version'  : project.jar.archiveVersion,
                    'Implementation-Vendor'   : mod_author,
                    'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    'Timestamp'               : System.currentTimeMillis(),
                    'Built-On-Java'           : "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})",
                    'Built-On-Minecraft'      : minecraft_version
            ])
        }
    }

    repositories {
        mavenCentral()
        maven { name = 'Sponge / Mixin'; url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { url "https://cursemaven.com"; content { includeGroup "curse.maven" } }
        exclusiveContent {
            forRepository {
                maven {
                    name = "Let's Do Maven"
                    url = "https://raw.githubusercontent.com/Let-s-Do-Collection/Foundation/1.21.1/maven"
                }
            }
            filter { includeGroup "net.satisfy.foundation" }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release.set(21)
    }

    processResources {
        def expandProps = [
                "version": version,
                "group": project.group,
                "minecraft_version": minecraft_version,

                // Fabric
                "fabric_version": fabric_version,
                "fabric_loader_version": fabric_loader_version,

                // NeoForge
                "neoforge_version": neoforge_version,
                "minecraft_version_range": minecraft_version_range,

                // Meta
                "mod_name": mod_name,
                "mod_author": mod_author,
                "mod_id": mod_id,
                "license": license,
                "description": project.description,
                "credits": credits
        ]

        filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/neoforge.mods.toml', '*.mixins.json']) {
            expand expandProps
        }
        inputs.properties(expandProps)
    }
}

