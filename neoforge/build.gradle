plugins {
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.+'
    id "com.modrinth.minotaur" version "2.+"
    id "net.darkhax.curseforgegradle" version "1.1.25"
}

java {
    withSourcesJar()
}

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

def changelogText = rootProject.file("CHANGELOG.md").text

repositories {
    mavenCentral()
    maven { url "https://maven.blamejared.com/" }
    maven { url "https://maven.theillusivec4.top/" }
    maven {
        url "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }
}

neoForge {
    version = neoforge_version
    runs {
        client {
            client()
            gameDirectory = file('run')
            sourceSet = sourceSets.main
        }
        server {
            server()
            gameDirectory = file('run')
            sourceSet = sourceSets.main
        }
        data {
            data()
            gameDirectory = file('run')
            programArguments = [
                    "--mod", mod_id,
                    "--all",
                    "--output", file('src/generated/resources/').absolutePath,
                    "--existing", file('src/main/resources/').absolutePath
            ]
            sourceSet = sourceSets.main
        }
    }
    mods {
        register(mod_id) {
            sourceSet(sourceSets.main)
            sourceSet(project(":common").sourceSets.main)
        }
    }
}

sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
        }
    }
}

dependencies {
    implementation project(":common")
    annotationProcessor "org.spongepowered:mixin:0.8.5-SNAPSHOT:processor"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${rootProject.jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${rootProject.jei_version}"
    implementation "top.theillusivec4.curios:curios-neoforge:${rootProject.curios_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(21)
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

tasks.named('jar', Jar) {
    from(project(':common').sourceSets.main.output)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "lets-do-camping"
    versionNumber = rootProject.version
    versionName = "${rootProject.mod_name} ${rootProject.version} [${rootProject.minecraft_version}-neoforge]"
    versionType = "release"
    changelog = rootProject.file("CHANGELOG.md").exists() ? rootProject.file("CHANGELOG.md").text : " "
    gameVersions = [rootProject.minecraft_version]
    loaders = ["neoforge"]
    uploadFile = tasks.named("jar")
    dependencies {
        required.project "curios"
    }
}

tasks.register("curseforge1072398", net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    apiToken = System.getenv("CURSEFORGE_API_KEY")
    disableVersionDetection()

    def mainFile = upload("1072398", tasks.named("jar"))
    mainFile.releaseType = "release"
    mainFile.changelog = changelogText
    mainFile.changelogType = "markdown"
    mainFile.displayName = "${rootProject.mod_name} - ${rootProject.version} - NEOFORGE - ${rootProject.minecraft_version}"
    mainFile.addGameVersion(rootProject.minecraft_version)
    mainFile.addModLoader("NeoForge")
    mainFile.addEnvironment("Client", "Server")
    mainFile.addRequirement("curios")
}